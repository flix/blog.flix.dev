title = "The Flix Blog"
theme = "tabi"
base_url = "https://blog.flix.dev/"
description = "The official blog of the Flix programming language."
compile_sass = true
build_search_index = false

generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

taxonomies = [
    {name = "tags", feed = true},
    {name = "authors", feed = true}
]

[extra]
skin = "red"
default_theme = "dark"
show_author = true
favicon = "favicon.png"
menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
]
stylesheets = ["highlight.css", "highlight_fix.css"]
enable_csp = false
